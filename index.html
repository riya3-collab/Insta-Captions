<head>

    <style>

        body {
            background: #1a0a1f; color: #fff; font-family: 'Poppins', sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fad0c4, #a18cd1, #fbc2eb);
            background-size: 400% 400%; animation: gradient 12s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
   .glass {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 28px; padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(161, 140, 209, 0.4);
            max-width: 550px; margin: 20px auto;
        }
        h1 {
            text-align: center; font-family: 'Playfair Display', serif; font-size: 34px;
            background: linear-gradient(90deg, #ff71ce, #c084fc, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255,113,206,0.4);
        }
      .neon-pink { color: #ff71ce; text-shadow: 0 0 10px #ff71ce; }
      .category-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
      .vibe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
      .btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 12px; border-radius: 18px; font-family: 'Poppins';
            cursor: pointer; transition: all 0.3s ease; font-weight: 500; font-size: 14px;
        }
      .btn:hover,.btn.active {
            background: linear-gradient(135deg, rgba(255, 113, 206, 0.4), rgba(168, 85, 247, 0.4));
            transform: translateY(-2px); box-shadow: 0 0 20px rgba(255, 113, 206, 0.7);
            border-color: #ff71ce;
        }
        #output {
            background: rgba(0, 0, 0, 0.2); border-radius: 20px; padding: 25px;
            margin-top: 20px; min-height: 120px; font-size: 16px; line-height: 1.7;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }
        #copy-btn {
            background: linear-gradient(90deg, #ff71ce, #a855f7, #c084fc); border: none; color: white;
            padding: 16px 28px; border-radius: 50px; font-family: 'Poppins';
            cursor: pointer; font-weight: 700; width: 100%; margin-top: 15px;
            display: none; transition: all 0.3s ease; font-size: 15px;
        }
        #copy-btn:hover { transform: scale(1.03); box-shadow: 0 0 30px #ff71ce; }
      .hashtag { color: #f9a8d4; font-weight: 500; }
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(90deg, #ff71ce, #a855f7); color: white; padding: 14px 28px;
            border-radius: 50px; display: none; font-weight: 600; box-shadow: 0 0 20px rgba(255,113,206,0.6);
        }
      .label { font-weight: 700; color: #fbcfe8; margin-top: 15px; display: block; }
    </style>
</head>

        };

        let currentCat = 'love';
        let currentVibe = 'softgirl';
        let currentCaption = '';

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCat = btn.dataset.cat;
                generateCaption();
            };
        });

        document.querySelectorAll('.vibe-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.vibe-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentVibe = btn.dataset.vibe;
                generateCaption();
            };
        });

        function generateCaption() {
            const captions = CAPTIONS[currentCat][currentVibe];
            const randomIndex = Math.floor(Math.random() * captions.length);
            currentCaption = captions[randomIndex].replace(/<[^>]*>/g, '');
            document.getElementById('output').innerHTML = captions[randomIndex];
            document.getElementById('copy-btn').style.display = 'block';
            console.log(`95LPA: Generated ${currentCat} + ${currentVibe} caption`);
        }

        document.getElementById('copy-btn').onclick = () => {
            navigator.clipboard.writeText(currentCaption).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        };

        window.onload = generateCaption;
    </script>
